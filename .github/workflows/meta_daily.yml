name: Meta to BigQuery Daily

on:
  schedule:
    # 한국시간(KST) 오전 7시 = UTC 22:00 (KST = UTC+9). 깃허브 cron은 UTC 기준.
    # 03:30 KST 0차 (260819 신설, 본부장 「오전 5시로 하자」 — 대시보드 첫 회차를 05:00으로
    # 당기려면 그보다 앞서 원천이 있어야 한다. meta 03:30 → marts 04:30 → 대시보드 05:00 순서).
    # ⚠️ 자정 마감 직후라 **메타가 아직 보정 중일 수 있다.** 그래서 아래 회차를 그대로 둔다 —
    #    날짜 파티션 WRITE_TRUNCATE + LOOKBACK_DAYS=7이라 뒤 회차가 덮는다.
    - cron: "30 18 * * *"    # 03:30 KST (0차)
    # 06:00 KST 1차 (260813 신설, 본부장 「전날이면 아침 6시로」).
    # 전날 데이터는 자정에 마감되므로 07:17까지 기다릴 이유가 없다. 소비 쪽(자사몰
    # 대시보드)이 아침 일찍 도는데 광고비가 비어 ROAS가 과대로 나오는 일이 반복됐다.
    # ⚠️ **아래 회차를 지우지 않는다.** 메타는 자정 직후에도 전날 값을 보정하므로 06:00
    #    단독이면 그날 화면이 과소로 굳는다. 적재는 날짜 파티션 WRITE_TRUNCATE이고
    #    LOOKBACK_DAYS=7이라 **여러 번 돌아도 중복이 없고 뒤 회차가 덮는다** — 유지 비용 0.
    - cron: "0 21 * * *"     # 06:00 KST (1차)
    - cron: "17 22 * * *"    # 07:17 KST
    - cron: "42 22 * * *"    # 07:42 KST (누락 대비)
    - cron: "17 0 * * *"     # 09:17 KST (누락 대비 재시도)
  workflow_dispatch:
    inputs:
      backfill_months:
        description: "과거 N개월 1회 백필 (예: 37). 비워두면 일상 모드(최근 7일)."
        required: false
        default: ""
      attr_windows:
        description: "어트리뷰션 윈도우(콤마). 예: 1d_click,7d_click,1d_view,1d_ev. 비우면 기본만."
        required: false
        default: ""
      target_table:
        description: "적재 대상 테이블(검증용 임시표 지정 가능). 비우면 rf_meta_ads."
        required: false
        default: ""
      lookback_days:
        description: "일상 모드에서 최근 며칠. 비우면 7."
        required: false
        default: ""
      since:
        description: "구간 백필 시작일 YYYY-MM-DD (until과 함께). 장기간 청크 실행용."
        required: false
        default: ""
      until:
        description: "구간 백필 종료일 YYYY-MM-DD (since와 함께)."
        required: false
        default: ""

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      - name: 서비스계정 키 파일 만들기 (시크릿에서)
        run: |
          cat > sa_key.json <<'KEY'
          ${{ secrets.GCP_SA_KEY }}
          KEY
      - name: 적재 실행
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa_key.json
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_IDS: ${{ secrets.AD_ACCOUNT_IDS }}
          BQ_PROJECT: rf-ads-db-500505
          BQ_DATASET: meta_ads
          BQ_TABLE: ${{ github.event.inputs.target_table || 'rf_meta_ads' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          BACKFILL_MONTHS: ${{ github.event.inputs.backfill_months }}
          META_SINCE: ${{ github.event.inputs.since }}
          META_UNTIL: ${{ github.event.inputs.until }}
          # 스케줄/수동 모두 어트리뷰션 윈도우 포함 수집(입력이 있으면 우선). value(계정 기본)는 불변.
          META_ATTR_WINDOWS: ${{ github.event.inputs.attr_windows || '1d_click,7d_click,1d_view,1d_ev' }}
        run: python meta_to_bigquery.py
      - name: 메타 평탄화 뷰 갱신 (meta/sql/*.sql)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa_key.json
          BQ_PROJECT: rf-ads-db-500505
          BQ_LOCATION: asia-northeast3
        run: python meta/refresh_meta_views.py
      - name: 키 파일 삭제
        if: always()
        run: rm -f sa_key.json
