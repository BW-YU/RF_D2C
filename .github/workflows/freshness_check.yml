name: Data Freshness Check

on:
  schedule:
    - cron: "0 1 * * *"    # 매일 10:00 KST (모든 적재 이후). 오래되면 실패→알림.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-cloud-bigquery requests
      - name: 서비스계정 키 파일
        run: |
          cat > sa_key.json <<'KEY'
          ${{ secrets.GCP_SA_KEY }}
          KEY
      - name: 신선도 점검
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa_key.json
          BQ_PROJECT: rf-ads-db-500505
          BQ_LOCATION: asia-northeast3
          # Mac mini 07:00 orchestrator가 호출한 수동 실행만 Slack 전송.
          # 10:00 schedule은 GitHub 상태·이메일만 남겨 같은 incident 중복 게시를 막는다.
          SLACK_WEBHOOK_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.SLACK_WEBHOOK_URL || '' }}
          SLACK_BOT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.SLACK_BOT_TOKEN || '' }}
          SLACK_CHANNEL_ID: C0BF7RA2F8W
          SLACK_MENTION_ID: U03TZ6G38N6
        run: python monitoring/freshness_check.py
      - if: always()
        run: rm -f sa_key.json
