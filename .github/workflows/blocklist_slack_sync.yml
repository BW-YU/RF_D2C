name: 수신거부(BLOCKLIST) 슬랙 요청 적재

# 슬랙 #1_crm_cx 의 CRM 차단 요청 → BLOCKLIST 시트(클룹·스프린트만). 30분마다 + 수동 실행.
# 전제: 시트를 rf-mkt@rf-ads-db-500505.iam.gserviceaccount.com 에 '편집자' 공유.
#       secrets.SLACK_BOT_TOKEN 에 channels:history 권한 토큰 등록(#1_crm_cx 초대 필요).

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_APPLICATION_CREDENTIALS: sa_key.json
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: 서비스계정 키 파일
        run: |
          cat > sa_key.json <<'KEY'
          ${{ secrets.GCP_SA_KEY }}
          KEY
      - name: 슬랙 요청 적재
        run: python customer/slack_blocklist_sync.py
      - if: always()
        run: rm -f sa_key.json
