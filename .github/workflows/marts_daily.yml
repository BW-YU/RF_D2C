name: Marts Refresh Daily

on:
  schedule:
    # 04:30 KST 0차 (260819 신설). 대시보드 첫 회차 05:00보다 앞서 `mart.ad_unified_daily`를
    # 만들어야 한다 — 그 테이블이 없으면 화면의 어제 광고비가 0이 된다.
    # ⚠️ **meta_daily 03:30 뒤에** 와야 한다. 순서가 뒤집히면 옛 원본으로 mart를 만든다.
    - cron: "30 19 * * *"  # 04:30 KST (0차)
    # 07:10 KST 확정 회차. 06:00 원천 적재가 끝날 시간을 확보하고 07:30 데일리 대시보드보다
    # 20분 앞서 마트를 완성한다. GitHub cron 지연·원천 결손은 대시보드의 완전성 게이트가 막는다.
    - cron: "10 22 * * *"  # 매일 07:10 KST (= 22:10 UTC), 매체·카페24 원본 적재 이후
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_APPLICATION_CREDENTIALS: sa_key.json
      BQ_PROJECT: rf-ads-db-500505
      BQ_LOCATION: asia-northeast3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r marts/requirements.txt
      - name: 서비스계정 키 파일
        run: |
          cat > sa_key.json <<'KEY'
          ${{ secrets.GCP_SA_KEY }}
          KEY
      - name: 마트 갱신 (뷰 → 테이블)
        run: python marts/refresh_marts.py
      - if: always()
        run: rm -f sa_key.json
